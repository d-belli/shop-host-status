# Change these first
owner: d-belli # Your GitHub organization or username, where this repository lives
repo: shop-host-status # The name of this repository

sites:
  - name: 🌐 Site Oficial
    check: "tcp-ping"
    url: $IP_SITE
    port: 80

  - name: 👤 Área do Cliente
    check: "tcp-ping"
    url: $IP_SITE
    port: 80

  - name: 🇧🇷 Node BR 01 - Servidor Dedicado
    check: "tcp-ping"
    url: 181.215.45.203
    port: 4085

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there

  cname: uptime.shophost.com.br

  # baseUrl: /your-repo-name

  logoUrl: https://raw.githubusercontent.com/d-belli/shop-host-status/master/assets/logo.svg

  name: Shop Host Brasil Status

  introTitle: "🚀 Status em Tempo Real da Infraestrutura Shop Host Brasil"

  introMessage: |
    Acompanhe em tempo real a disponibilidade e estabilidade dos serviços da **Shop Host Brasil**.

    Nossa infraestrutura é monitorada continuamente para garantir
    máxima performance, segurança e estabilidade para todos os clientes.

    ### Serviços monitorados
    ✅ Site Oficial  
    ✅ Área do Cliente  
    ✅ Infraestrutura Cloud  
    ✅ Nodes Dedicados  
    ✅ Serviços Internos  

    Todos os serviços passam por verificações automáticas
    para assegurar alta disponibilidade e resposta rápida em caso de incidentes.

    Em caso de instabilidade, manutenção programada
    ou indisponibilidade, todas as atualizações serão publicadas automaticamente nesta página.

    💙 **Shop Host Brasil — Hospedagem de alta performance para projetos que exigem estabilidade.**

  navbar:
    - title: 📊 Status
      href: /

    # - title: Histórico
    #   href: /history

    - title: 🌐 Site Oficial
      href: https://shophost.com.br

    - title: 👤 Área do Cliente
      href: https://clientes.shophost.com.br

    # - title: GitHub
    #   href: https://github.com/$OWNER/$REPO

  themeUrl: https://uptime.shophost.com.br/shop.css

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration

i18n:
